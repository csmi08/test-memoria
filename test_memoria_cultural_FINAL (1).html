<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué haces con lo que se olvida? — Test de Memoria Cultural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --jungle: #1a2e1a;
  --moss: #2d4a2d;
  --fern: #3d6b3d;
  --leaf: #4a8c4a;
  --sage: #7ab87a;
  --mist: #b8d4b8;
  --cream: #f5f0e8;
  --parchment: #ede7d9;
  --gold: #c9a84c;
  --ink: #1a1a1a;
  --bark: #5c4a2a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--jungle);
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NOISE TEXTURE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* ── ANIMATED BG LEAVES ── */
.bg-leaves {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-leaf {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--leaf);
  border-radius: 50%;
  animation: drift linear infinite;
  opacity: 0;
}
@keyframes drift {
  0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-10vh) translateX(40px) rotate(180deg); opacity: 0; }
}

/* ── CONTAINER ── */
.container {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ── HERO / INTRO ── */
#screen-intro {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px;
  position: relative;
}

.intro-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--sage);
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.2s forwards;
}

.intro-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 400;
  line-height: 1.1;
  color: var(--cream);
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.4s forwards;
}

.intro-title em {
  font-style: italic;
  color: var(--sage);
}

.intro-divider {
  width: 48px;
  height: 1px;
  background: var(--gold);
  margin: 28px auto;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.6s forwards;
}

.intro-body {
  font-size: 16px;
  font-weight: 300;
  line-height: 1.8;
  color: var(--mist);
  max-width: 480px;
  margin: 0 auto 48px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.8s forwards;
}

.intro-meta {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: 48px;
  opacity: 0;
  animation: fadeUp 0.8s ease 1s forwards;
}

.meta-item {
  text-align: center;
}
.meta-num {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--gold);
  display: block;
  line-height: 1;
}
.meta-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sage);
  margin-top: 4px;
  display: block;
}

.btn-start {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: var(--gold);
  color: var(--jungle);
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.05em;
  padding: 16px 40px;
  border: none;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s ease;
  opacity: 0;
  animation: fadeUp 0.8s ease 1.2s forwards;
}
.btn-start:hover {
  background: var(--cream);
  transform: translateY(-2px);
}
.btn-start svg { transition: transform 0.2s ease; }
.btn-start:hover svg { transform: translateX(4px); }

/* ── QUESTION SCREEN ── */
#screen-questions {
  display: none;
  min-height: 100vh;
  padding: 40px 0 80px;
}

/* PROGRESS */
.progress-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: rgba(255,255,255,0.08);
  z-index: 100;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--fern), var(--gold));
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

.progress-info {
  padding: 24px 24px 0;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.progress-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--sage);
}
.progress-counter {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--gold);
}

/* QUESTION CARD */
.q-card {
  max-width: 720px;
  margin: 48px auto 0;
  padding: 0 24px;
  animation: fadeUp 0.5s ease forwards;
}

.q-tag {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sage);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.q-tag::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(122,184,122,0.2);
}

.q-text {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  line-height: 1.45;
  color: var(--cream);
  margin-bottom: 40px;
  font-weight: 400;
}

/* OPTIONS */
.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px 24px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(122,184,122,0.15);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  width: 100%;
  color: var(--cream);
}
.opt:hover {
  background: rgba(122,184,122,0.08);
  border-color: rgba(122,184,122,0.4);
  transform: translateX(4px);
}
.opt.selected {
  background: rgba(122,184,122,0.12);
  border-color: var(--sage);
}

.opt-badge {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--gold);
  width: 24px;
  flex-shrink: 0;
  margin-top: 1px;
  font-style: italic;
}
.opt-text {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.6;
  color: var(--mist);
}
.opt.selected .opt-text { color: var(--cream); }

/* NAV */
.q-nav {
  max-width: 720px;
  margin: 32px auto 0;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.btn-back {
  background: transparent;
  border: 1px solid rgba(122,184,122,0.25);
  color: var(--sage);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 12px 24px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}
.btn-back:hover { border-color: var(--sage); }
.btn-next {
  background: var(--fern);
  border: none;
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  font-size: 15px;
  padding: 14px 36px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-next:hover { background: var(--leaf); transform: translateY(-1px); }
.btn-next:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

/* ── RESULT SCREEN ── */
#screen-result {
  display: none;
  min-height: 100vh;
}

.result-hero {
  position: relative;
  height: 55vh;
  min-height: 320px;
  overflow: hidden;
}

.result-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.55) saturate(0.8);
}

.result-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(26,46,26,0.3) 0%, rgba(26,46,26,0.95) 100%);
}

.result-hero-text {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 40px;
  text-align: center;
}
.result-eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
  display: block;
}
.result-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 400;
  color: var(--cream);
  line-height: 1.2;
}

.result-body {
  max-width: 640px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

/* SCORE PILLS */
.score-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 48px;
}
.score-pill {
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid rgba(122,184,122,0.2);
  color: var(--sage);
}
.score-pill.winner {
  background: rgba(122,184,122,0.15);
  border-color: var(--sage);
  color: var(--cream);
}

/* POEM */
.poem-block {
  border-left: 2px solid var(--gold);
  padding: 8px 0 8px 28px;
  margin-bottom: 40px;
}
.poem-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
  display: block;
}
.poem-text {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-style: italic;
  line-height: 2;
  color: var(--mist);
}

/* EXPLANATION */
.explain-block {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(122,184,122,0.12);
  border-radius: 4px;
  padding: 28px 32px;
  margin-bottom: 48px;
}
.explain-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sage);
  margin-bottom: 16px;
  display: block;
}
.explain-text {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.85;
  color: var(--mist);
}

/* SHARE */
.share-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-share {
  background: rgba(122,184,122,0.1);
  border: 1px solid rgba(122,184,122,0.3);
  color: var(--sage);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  letter-spacing: 0.05em;
  padding: 12px 24px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}
.btn-share:hover { background: rgba(122,184,122,0.2); border-color: var(--sage); color: var(--cream); }
.btn-restart {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--mist);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 12px 24px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}
.btn-restart:hover { border-color: var(--mist); color: var(--cream); }

/* FOOTER DIVIDER */
.result-divider {
  width: 40px;
  height: 1px;
  background: var(--fern);
  margin: 48px auto;
}

/* COPY TOAST */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--moss);
  border: 1px solid var(--sage);
  color: var(--cream);
  font-size: 14px;
  padding: 12px 24px;
  border-radius: 4px;
  transition: transform 0.3s ease;
  z-index: 1000;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .result-hero-text { padding: 24px 20px; }
  .result-body { padding: 36px 20px 60px; }
  .explain-block { padding: 20px; }
  .poem-block { padding-left: 20px; }
  .intro-meta { gap: 24px; }
}
</style>
</head>
<body>

<!-- Floating particles -->
<div class="bg-leaves" id="bg-leaves"></div>

<!-- ═══════════════ INTRO ═══════════════ -->
<section id="screen-intro">
  <div class="container">
    <p class="intro-eyebrow">Experiencia educativa interactiva</p>
    <h1 class="intro-title">¿Qué haces<br>con lo que <em>se olvida?</em></h1>
    <div class="intro-divider"></div>
    <p class="intro-body">
      Este no es un test de conocimiento.<br>
      Es un espejo sobre cómo vives la memoria,<br>
      el cambio y la identidad cultural.
    </p>
    <div class="intro-meta">
      <div class="meta-item">
        <span class="meta-num">7</span>
        <span class="meta-label">preguntas</span>
      </div>
      <div class="meta-item">
        <span class="meta-num">4</span>
        <span class="meta-label">perfiles</span>
      </div>
      <div class="meta-item">
        <span class="meta-num">~3'</span>
        <span class="meta-label">minutos</span>
      </div>
    </div>
    <button class="btn-start" onclick="startTest()">
      Comenzar
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>

<!-- ═══════════════ QUESTIONS ═══════════════ -->
<section id="screen-questions">
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  <div class="progress-info">
    <span class="progress-label">Reflexión</span>
    <span class="progress-counter" id="prog-counter">1 / 7</span>
  </div>
  <div id="q-area"></div>
  <div class="q-nav" id="q-nav">
    <button class="btn-back" id="btn-back" onclick="goBack()">← Atrás</button>
    <button class="btn-next" id="btn-next" onclick="goNext()" disabled>
      Siguiente
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>

<!-- ═══════════════ RESULT ═══════════════ -->
<section id="screen-result">
  <div class="result-hero">
    <img class="result-img" id="result-img" src="" alt="">
    <div class="result-hero-overlay"></div>
    <div class="result-hero-text">
      <span class="result-eyebrow">Tu perfil</span>
      <h2 class="result-name" id="result-name"></h2>
    </div>
  </div>
  <div class="result-body">
    <div class="score-row" id="score-row"></div>
    <div class="poem-block">
      <span class="poem-label">Tu poema</span>
      <div class="poem-text" id="result-poem"></div>
    </div>
    <div class="explain-block">
      <span class="explain-label">Lo que esto dice de ti</span>
      <p class="explain-text" id="result-explain"></p>
    </div>
    <div class="result-divider"></div>
    <div class="share-row">
      <button class="btn-share" onclick="copyLink()">Copiar enlace</button>
      <button class="btn-share" onclick="shareNative()">Compartir</button>
      <button class="btn-restart" onclick="restartTest()">Volver a empezar</button>
    </div>
  </div>
</section>

<div class="toast" id="toast">Enlace copiado</div>

  ]},

const LABELS = { guardian:"Guardián", adaptador:"Adaptador", explorador:"Explorador", desconectado:"Desconectado" };

let cur = 0, answers = [];

// Particles
function initParticles() {
  const container = document.getElementById('bg-leaves');
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'bg-leaf';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (12 + Math.random() * 20) + 's';
    el.style.animationDelay = (Math.random() * 15) + 's';
    el.style.width = el.style.height = (2 + Math.random() * 3) + 'px';
    container.appendChild(el);
  }
}
initParticles();

function show(id) {
  ['screen-intro','screen-questions','screen-result'].forEach(s => {
    document.getElementById(s).style.display = s === id ? (id==='screen-intro'?'flex':'block') : 'none';
  });
  window.scrollTo(0, 0);
}

function startTest() {
  cur = 0; answers = [];
  show('screen-questions');
  render();
}

function render() {
  const q = Qs[cur];
  const pct = Math.round((cur / Qs.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-counter').textContent = (cur+1) + ' / ' + Qs.length;
  document.getElementById('btn-back').style.visibility = cur > 0 ? 'visible' : 'hidden';
  const next = document.getElementById('btn-next');
  next.disabled = !answers[cur];
  next.textContent = cur === Qs.length-1 ? 'Ver mi resultado' : 'Siguiente';
  if (cur < Qs.length-1) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','14');svg.setAttribute('height','14');svg.setAttribute('viewBox','0 0 16 16');svg.setAttribute('fill','none');
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M3 8h10M9 4l4 4-4 4');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','1.5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
    svg.appendChild(p); next.appendChild(svg);
  }
  document.getElementById('q-area').innerHTML =
    '<div class="q-card">' +
    '<div class="q-tag">Pregunta ' + (cur+1) + '</div>' +
    '<p class="q-text">' + q.text + '</p>' +
    '<div class="options">' +
    q.opts.map(o => '<button class="opt'+(answers[cur]===o.label?' selected':'')+'" onclick="pick(''+o.label+'')">' +
      '<span class="opt-badge">'+o.label+'</span>' +
      '<span class="opt-text">'+o.text+'</span>' +
    '</button>').join('') +
    '</div></div>';
}

function pick(label) {
  answers[cur] = label;
  document.getElementById('btn-next').disabled = false;
  render();
}

function goNext() {
  if (!answers[cur]) return;
  if (cur < Qs.length-1) { cur++; render(); }
  else showResult();
}

function goBack() { if (cur > 0) { cur--; render(); } }

function showResult() {
  const counts = { guardian:0, adaptador:0, explorador:0, desconectado:0 };
  answers.forEach((lbl,i) => {
    const opt = Qs[i].opts.find(o => o.label===lbl);
    if (opt) counts[opt.p]++;
  });
  const winner = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const r = RESULTS[winner];
  document.getElementById('result-img').src = IMGS[r.img];
  document.getElementById('result-img').alt = r.name;
  document.getElementById('result-name').textContent = r.name;
  document.getElementById('result-poem').innerHTML = r.poem;
  document.getElementById('result-explain').textContent = r.text;
  document.getElementById('score-row').innerHTML = Object.entries(counts).map(([k,v]) =>
    '<span class="score-pill'+(k===winner?' winner':'')+'">'+LABELS[k]+': '+v+'</span>'
  ).join('');
  show('screen-result');
}

function copyLink() {
  const url = window.location.href.split('?')[0];
  navigator.clipboard.writeText(url).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}

function shareNative() {
  if (navigator.share) {
    navigator.share({
      title: '¿Qué haces con lo que se olvida?',
      text: 'Descubré mi perfil de memoria cultural. ¿Cuál es el tuyo?',
      url: window.location.href
    });
  } else { copyLink(); }
}

function restartTest() {
  cur = 0; answers = [];
  show('screen-intro');
}
</script>
